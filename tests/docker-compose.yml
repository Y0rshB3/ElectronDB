# Throwaway database servers for the integration tests (`npm run test:integration:required`).
#
#   docker compose -f tests/docker-compose.yml up -d --wait
#   docker compose -f tests/docker-compose.yml down -v      # removes containers and data
#
# Every port is bound to 127.0.0.1 only, and never to 3306/3307 (real servers live there).
# The credentials are throwaway test values (root / navidog, database navidog_test) that
# match the URLs documented in the README; they have nothing to do with real data.
#
# If the older stand-alone 8.4 container (navidog-test-mysql or electrondb-test-mysql) already
# owns 33306, start only the 5.7 service:
#   docker compose -f tests/docker-compose.yml up -d --wait mysql57
#
# MariaDB (33311) and PostgreSQL (55432, plus a throwaway SSH server on 52222 for the tunnel
# test) are here since 0.2.0; MongoDB (57017/57018) joins in its own phase
# (docs/multi-engine-design.md, section 15.3). Start only some services by naming them:
#   docker compose -f tests/docker-compose.yml up -d --wait mariadb11 postgres17 sshd
name: electrondb-test

services:
  # VORTAQ_TEST_MYSQL_URL=mysql://root:navidog@127.0.0.1:33306/navidog_test
  mysql84:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: navidog
      MYSQL_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h127.0.0.1', '-uroot', '-pnavidog', '--silent']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # VORTAQ_TEST_MYSQL57_URL=mysql://root:navidog@127.0.0.1:33357/navidog_test
  # mysql:5.7 is amd64-only: on Apple Silicon it runs emulated (slower first start).
  # Stock server settings on purpose (latin1 server charset, 5.7 default sql_mode), so the
  # tests see what a default 5.7 production server does.
  mysql57:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: navidog
      MYSQL_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33357:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h127.0.0.1', '-uroot', '-pnavidog', '--silent']
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s

  # VORTAQ_TEST_MARIADB_URL=mysql://root:navidog@127.0.0.1:33311/navidog_test
  # Native arm64/amd64 image. A `mysql` connection pointed at it exercises the MariaDB fixes.
  mariadb11:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: navidog
      MARIADB_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33311:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # VORTAQ_TEST_PG_URL=postgres://postgres:navidog@127.0.0.1:55432/navidog_test
  # uuid-ossp and pgcrypto are created in `public` by the tests themselves (idempotent).
  postgres17:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: navidog
      POSTGRES_DB: navidog_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'navidog_test']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # VORTAQ_TEST_SSH_URL=ssh://vortaq:navidog@127.0.0.1:52222  (optional)
  # Throwaway SSH server on the compose network: the PostgreSQL tunnel test connects to it and
  # forwards to `postgres17:5432`. Password login for a test-only user; never reuse elsewhere.
  sshd:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: vortaq
      USER_PASSWORD: navidog
      PASSWORD_ACCESS: 'true'
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - '127.0.0.1:52222:2222'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 2222 || exit 1']
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
