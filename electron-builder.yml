# Identity: never change appId (or productName / package.json "name"). electron-builder derives the
# Windows installer GUID from appId (UUID v5 -> ed60cf51-f5c8-5d88-9777-022dc431ddb4): the uninstall
# registry key, the install folder lookup and the upgrade of an existing installation depend on it.
appId: dev.y0rshb3.electrondb
productName: ElectronDB
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # ssh2's optional native bindings are built for the local Node ABI (and OS), never for
  # Electron. They cannot load in the packaged app and ssh2 falls back to pure JS, so they
  # are left out to keep cross-platform builds free of foreign binaries.
  - '!**/node_modules/cpu-features/**'
  - '!**/node_modules/ssh2/lib/protocol/crypto/build/**'
asarUnpack:
  - node_modules/ssh2/**
# Do not rebuild native modules for Electron: the only ones (ssh2 accelerators) are optional,
# and rebuilding them would require compilers (Visual Studio Build Tools, Xcode CLT, make).
npmRebuild: false
# Releases are built on an Apple Silicon Mac without Rosetta: these toolsets ship native arm64
# makensis and AppImage tools (the legacy 0.0.0 toolsets are x86_64 only).
toolsets:
  nsis: '1.2.1'
  appimage: '1.0.3'
# In-app updates (electron-updater, Windows NSIS and Linux AppImage): builds write latest.yml,
# latest-linux.yml, latest-mac.yml and .blockmap files next to the installers, and the packaged
# app gets resources/app-update.yml pointing at this repository. Building never uploads anything:
# every dist script passes `--publish never`; the release is uploaded by hand.
publish:
  provider: github
  owner: Y0rshB3
  repo: ElectronDB
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Applies to the zip (dmg has its own pattern below): ElectronDB-<version>-<arch>-mac.zip.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # Ad-hoc signature ('-'): no Apple certificate, but the whole bundle gets a valid signature.
  # With `null` the bundle keeps Electron's linker-only signature, fails `codesign --verify`
  # and a downloaded copy is reported as "damaged" on Apple Silicon. Ad-hoc signing needs
  # hardenedRuntime off (library validation would reject Electron's pre-signed frameworks).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSAppleEventsUsageDescription: ElectronDB schedules backup jobs through launchd.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
    - portable
# Per-user, one-click installer (no admin rights, no UAC prompt, no "for all users" choice):
# %LOCALAPPDATA%\Programs\ElectronDB, registry under HKCU only. This is the layout electron-updater
# expects, and an update can never mix a per-machine and a per-user copy. The installer closes a
# running ElectronDB before replacing files (built-in check), keeps %APPDATA%\ElectronDB (user data)
# on uninstall and update, and build/installer.nsh lets it install over a broken previous copy.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  include: build/installer.nsh
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Y0rshB3 <Y0rshB3@users.noreply.github.com>
  synopsis: Cliente MySQL de escritorio compatible con datos de Navicat
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
