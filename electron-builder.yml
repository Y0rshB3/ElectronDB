# Identity. appId keeps the ElectronDB-era value on purpose and must never change:
# - Windows: electron-builder derives the installer GUID from it (UUID v5 ->
#   ed60cf51-f5c8-5d88-9777-022dc431ddb4). The uninstall registry key, the lookup of the existing
#   install folder and the upgrade of an ElectronDB installation (in-app update included) depend on
#   it. An upgraded machine keeps its install folder (%LOCALAPPDATA%\Programs\ElectronDB, read from
#   the registry); the old shortcuts (ElectronDB.lnk) are removed and Vortaq.lnk is created.
# - macOS: it is the bundle id (CFBundleIdentifier); keeping it keeps the app's identity for the
#   system (privacy permissions, LaunchServices).
# productName (Vortaq) names the app, its executable, the shortcuts and the artifacts.
appId: dev.y0rshb3.electrondb
productName: Vortaq
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # ssh2's optional native bindings are built for the local Node ABI (and OS), never for
  # Electron. They cannot load in the packaged app and ssh2 falls back to pure JS, so they
  # are left out to keep cross-platform builds free of foreign binaries.
  - '!**/node_modules/cpu-features/**'
  - '!**/node_modules/ssh2/lib/protocol/crypto/build/**'
asarUnpack:
  - node_modules/ssh2/**
# Shipped next to app.asar (process.resourcesPath):
# - icon.png: window icon on Windows/Linux (BrowserWindow `icon`, src/main/windowOptions.ts);
# - LICENSE and THIRD_PARTY_LICENSES.txt: shown in «Acerca de Vortaq» (src/main/licenses.ts). The
#   notices are generated from the production dependencies by scripts/third-party-licenses.mjs,
#   which `npm run build` runs (release.mjs --skip-build reuses the out/ of an earlier build).
extraResources:
  - from: build/icons/512x512.png
    to: icon.png
  - from: LICENSE
    to: LICENSE
  - from: out/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
# Do not rebuild native modules for Electron: the only ones (ssh2 accelerators) are optional,
# and rebuilding them would require compilers (Visual Studio Build Tools, Xcode CLT, make).
npmRebuild: false
# Releases are built on an Apple Silicon Mac without Rosetta: these toolsets ship native arm64
# makensis and AppImage tools (the legacy 0.0.0 toolsets are x86_64 only).
toolsets:
  nsis: '1.2.1'
  appimage: '1.0.3'
# In-app updates (electron-updater, Windows NSIS and Linux AppImage): builds write latest.yml,
# latest-linux.yml, latest-mac.yml and .blockmap files next to the installers, and the packaged
# app gets resources/app-update.yml pointing at this repository. Building never uploads anything:
# every dist script passes `--publish never`; the release is uploaded by hand. From Vortaq 2.0.0 the
# feed is Y0rshB3/Vortaq (keep it in sync with UPDATE_REPO in src/main/brand.ts). ElectronDB 0.1.x
# copies read Y0rshB3/ElectronDB, which GitHub redirects once the repository is renamed; the
# unchanged appId above makes the 2.0.0 installer upgrade them in place.
publish:
  provider: github
  owner: Y0rshB3
  repo: Vortaq
  releaseType: release
mac:
  # Windows and Linux builds already ship Electron's notices next to the executable
  # (LICENSE.electron.txt, LICENSES.chromium.html); the macOS bundle does not, so they are added to
  # Contents/Resources (merged with the top-level extraResources).
  extraResources:
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
  # Generated by scripts/make-icons.py from build/vortaq-icon-source.png (see build/README.md).
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Applies to the zip (dmg has its own pattern below): Vortaq-<version>-<arch>-mac.zip.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # Ad-hoc signature ('-'): no Apple certificate, but the whole bundle gets a valid signature.
  # With `null` the bundle keeps Electron's linker-only signature, fails `codesign --verify`
  # and a downloaded copy is reported as "damaged" on Apple Silicon. Ad-hoc signing needs
  # hardenedRuntime off (library validation would reject Electron's pre-signed frameworks).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSAppleEventsUsageDescription: Vortaq schedules backup jobs through launchd.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
# Per-user, one-click installer (no admin rights, no UAC prompt, no "for all users" choice):
# %LOCALAPPDATA%\Programs\Vortaq on a new machine, registry under HKCU only. This is the layout
# electron-updater expects, and an update can never mix a per-machine and a per-user copy. The
# installer closes a running copy before replacing files (built-in check, see build/installer.nsh
# for the upgrade from ElectronDB), keeps the user data folders (%APPDATA%\Vortaq and
# the old %APPDATA%\ElectronDB) on uninstall and update, and build/installer.nsh lets it install over
# a broken previous copy.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  include: build/installer.nsh
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
linux:
  # Folder of <size>x<size>.png files: each one becomes a hicolor theme icon.
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Y0rshB3 <Y0rshB3@users.noreply.github.com>
  synopsis: Cliente de bases de datos de escritorio
# The .deb package was called "electrondb" before the rename: installing vortaq replaces it, so
# apt removes the old package instead of leaving both installed (Debian's rename idiom).
deb:
  fpm:
    - --replaces=electrondb
    - --conflicts=electrondb
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
