<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vortaq</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"
    />
    <link rel="icon" type="image/png" href="./src/assets/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body>
    <!-- Startup splash: plain HTML/CSS so it paints before the app bundle runs; removed by src/utils/splash.ts. -->
    <div id="splash" role="status" aria-label="Iniciando Vortaq">
      <div class="splash__mark">
        <img src="./src/assets/app-icon.png" alt="" width="112" height="112" />
      </div>
      <div class="splash__name">Vortaq</div>
      <div class="splash__bar"><span></span></div>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #090c13;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash__mark {
        border-radius: 26px;
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      .splash__mark img {
        display: block;
        border-radius: 26px;
      }
      .splash__name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        opacity: 0.85;
      }
      .splash__bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.18);
      }
      .splash__bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #22d3ee, #8b5cf6);
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.25)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 26px rgba(139, 92, 246, 0.55)); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-color-scheme: light) {
        #splash { background: #f5f7fb; color: #0f172a; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__bar span { animation: none; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
